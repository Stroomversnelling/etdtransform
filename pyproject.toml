[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etdtransform"
version = "0.1.0"
description = "Mapping helper functions for EnergieTransitieDataset."
readme = "README.md"
authors = [
    { name = "Nicolas Dickinson", email = "dickinson@washnote.com"},
    { name = 'Petra Izeboud', email = 'petra.izeboud@live.nl'},
    { name = "Marten Witkamp", email = "marten@wattopia.nl"},
    ]
maintainers = [
    { name = "Nicolas Dickinson", email = "dickinson@washnote.com"},
    { name = 'Petra Izeboud', email = 'petra.izeboud@live.nl'},
    ]
requires-python = ">= 3.9"
dependencies = [
    "pandas>=2.2",
    "ibis-framework[duckdb]",
    "sympy>=1.12",
    "pyarrow",
    "polars",
    # etdmap is a peer source-installed dependency in this project
    # (ADR-004 dependency chain: etdmap -> etdtransform). Listed as a
    # plain requirement so pip will not try to re-fetch from a git URL
    # when a local install is already present in the venv. Install from
    # source: pip install ../etdmap
    "etdmap",
]
keywords = ["stroomversnelling", "energietransitie", "warmtepomp"]


[project.urls]
repository = "https://github.com/Stroomversnelling/etdtransform"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
    "myst-parser",
]
ruffing = ["ruff"]
pytesting = ["pytest>=7"]
dev = ["pre-commit"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable pycodestyle (E, W), pyflakes (F) and Flake8 bugbear (B)
# as well as Ruff-specific-rules (RUF) and isort
select = ["E", "F", "B", "W", "RUF", "I"]


ignore = [
    # Avoid enforcing line-length violations
    "E501",
    # module level import not at top of file
    "E402",
    # do not assign a lambda expression, use a def
    "E731",
]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests}/*" = ["E402"]

[tool.ruff.format]
# 5. Use double quotes in `ruff format`.
quote-style = "double"

[tool.pytest.ini_options]
# The default run excludes the pipeline tests. Add --full-suite to include
# them; see the option's help text for when that is expected.
# --durations-min keeps the timing report quiet unless a test passes a second.
addopts = "-m 'not pipeline' --durations=10 --durations-min=1.0"
markers = [
    "unit: no disk IO; builds its frames in memory",
    "integration: reads or writes parquet, or runs a pipeline stage end to end",
    "pipeline: needs a pipeline built by a session fixture, or the mapped dataset on disk",
    "regenerate: writes a committed reference file; deselected unless asked for",
]
# The pipeline fixtures build whole pipelines into tmp_path: three session
# pipelines plus the per-test monolith-vs-sharded pairs put a --full-suite run
# at roughly 15 GB of scratch. pytest keeps the last three runs by default, so
# the default is a 45 GB ceiling on a machine the pipeline also needs disk on.
#
# retention_count = 1 keeps only the newest run. "failed" additionally drops the
# directories of tests that passed, so a green run leaves almost nothing while a
# failure still leaves its inputs to look at.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
